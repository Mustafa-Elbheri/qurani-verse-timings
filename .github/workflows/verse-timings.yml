name: Verse Timings
on:
  workflow_dispatch:
    inputs:
      reciter_index:
        description: 'Short CPU probe reader'
        required: true
        default: '5'
        type: string
      tracks:
        description: 'Al-Fatiha only'
        required: true
        default: '1'
        type: string
      publish:
        description: 'Publishing disabled on verification branch'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: verified-hadr-cpu-probe
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  CUDA_VISIBLE_DEVICES: ''
  QURANI_CPU_THREADS: '4'
jobs:
  verify-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Assert limited diagnostic scope
        env:
          REQUESTED_TRACKS: ${{ inputs.tracks }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          test "$REQUESTED_TRACKS" = 1
          test "$REQUESTED_PUBLISH" = false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: verified-hadr-cpu-models-v1
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.15.0 torchaudio==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r pipeline/requirements.txt transformers==4.57.3 numpy==2.4.6
          python -c "import torch, torchaudio; assert torch.version.cuda is None; print(torch.__version__, torchaudio.__version__)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Measure native CPU alignment
        env:
          READER_INDEX: ${{ inputs.reciter_index }}
        run: python pipeline/ci_cpu_probe.py --reciter-index "$READER_INDEX" --track 1
      - name: Preserve report and acoustic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-probe-results
          path: results/
          retention-days: 14
