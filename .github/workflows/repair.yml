name: Repair Pass

on:
  workflow_dispatch:
    inputs:
      reciter_index:
        description: 'رقم القارئ (أحمد الحداد = 6)'
        required: true
        default: '6'
        type: string
      tracks:
        description: 'أرقام الأجزاء المطلوب إصلاحها (مثال: 15,16,20)'
        required: true
        type: string
      server_url:
        description: 'وضع مخصص: رابط مجلد مباشر (اتركه فارغًا للوضع العادي)'
        required: false
        default: ''
        type: string
      reciter_name:
        description: 'اسم القارئ في الوضع المخصص'
        required: false
        default: 'مصحف مخصص'
        type: string
      file_pattern:
        description: 'نمط اسم الملف في الوضع المخصص'
        required: false
        default: '{:02d}.mp3'
        type: string

permissions:
  contents: read

concurrency:
  group: verse-repair-${{ inputs.reciter_index }}-${{ inputs.tracks }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        env:
          INPUT_RECITER_INDEX: ${{ inputs.reciter_index }}
          INPUT_TRACKS: ${{ inputs.tracks }}
          INPUT_SERVER_URL: ${{ inputs.server_url }}
          INPUT_RECITER_NAME: ${{ inputs.reciter_name }}
          INPUT_FILE_PATTERN: ${{ inputs.file_pattern }}
        run: python pipeline/prepare.py

  repair:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        track: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-large-v1
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Warm up Large-v3 model
        run: python -c "from faster_whisper import WhisperModel; WhisperModel('large-v3', device='cpu', compute_type='int8')"
      - name: Download audio
        run: python pipeline/download_track.py
        env:
          TRACK_URL: ${{ matrix.track.url }}
          TRACK_DIR: work/track-${{ matrix.track.number }}
      - name: Fulltrack free transcription (×2)
        run: |
          python pipeline/escalate.py \
            --audio "work/track-${{ matrix.track.number }}/audio.mp3" \
            --proposal /dev/null --review /dev/null \
            --out "work/track-${{ matrix.track.number }}/escalation" \
            --device cpu --compute-type int8 --fulltrack
      - name: Upload repair artifact
        uses: actions/upload-artifact@v4
        with:
          name: repair-track-${{ matrix.track.number }}
          path: work/track-${{ matrix.track.number }}/escalation/fulltrack-transcript.json
